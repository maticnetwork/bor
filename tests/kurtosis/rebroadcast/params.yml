dev:
  l1_backend: anvil

polygon_pos_package:
  log_level: debug
  network_params:
    el_block_interval_seconds: 1
  participants:
    - kind: validator
      cl_type: heimdall-v2
      el_type: bor
      el_image: bor:local
      count: 3
    - kind: rpc
      cl_type: heimdall-v2
      el_type: bor
      el_image: bor:local
      count: 1
    - kind: rpc
      cl_type: heimdall-v2
      el_type: bor
      el_image: 0xpolygon/bor:2.9.0
      count: 1
  additional_services:
    - tx_spammer
